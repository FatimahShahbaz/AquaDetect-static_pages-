<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | AquaDetect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--navy:#103f5d;--green:#147b55;--page:#f1f9f7;--ink:#183244;--muted:#68777d;--line:#e6eeeb}
*{box-sizing:border-box}
body {
    margin: 0;
    padding: 0;
}

.site {
    width: 100%;
    min-height: 100vh;
    margin: 0;
    box-shadow: none;
}
.topbar{height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-size:16px;font-weight:700;color:#fff;text-decoration:none}
.navlinks{display:flex;align-items:center;gap:20px}
.navlinks a{color:#fff;text-decoration:none;font-size:12px}
.navlinks .signup-link{background:#fff;color:var(--navy);padding:9px 17px;border-radius:7px}
.content{padding:26px 32px 30px}
h1,h2,h3,p{margin-top:0}
h1{font-size:27px;line-height:1.25;font-weight:700}
h2{font-size:21px;font-weight:700}
.small-muted{color:var(--muted);font-size:12px}
.btn-green{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn-green:hover{background:#106746;color:#fff}
.btn-outline{background:#fff;border:1px solid #d9e2df;color:#233b48}
.form-card{width: min(100%,370px);margin:54px auto 0;background:#fff;border:1px solid #edf1ef;border-radius:8px;padding:20px 20px 17px;box-shadow:0 1px 3px #00000008}
.form-card h2{font-size:20px;margin-bottom:3px}
.form-card .form-label{font-size:12px;margin-bottom:4px}
.form-card .form-control{height:37px;border-color:#d7ddda;border-radius:6px;font-size:13px;box-shadow:inset 0 1px 2px #00000008}
.form-card .mb-3{margin-bottom:12px!important}
.form-card .btn{height:37px;font-size:13px}
.form-foot{text-align:center;font-size:12px;margin:13px 0 0;color:#53636a}
.form-foot a{color:var(--green);font-weight:600;text-decoration:none}
.stat-card,.panel{background:#fff;border:1px solid #e9efec;border-radius:9px;box-shadow:0 1px 2px #00000005}
.stat-card{padding:16px 18px;min-height:75px}
.stat-label{font-size:11px;color:#78838a;margin-bottom:5px}
.stat-number{font-size:23px;font-weight:700;line-height:1}
.panel{padding:16px 18px}
.table{font-size:12px;margin-bottom:0;color:#344852}
.table thead th{font-weight:700;color:#243844;border-bottom-color:#edf1ef;white-space:nowrap}
.table td{border-color:#f0f3f2;vertical-align:middle}
.status{display:inline-block;border-radius:20px;padding:4px 9px;font-size:10px;white-space:nowrap}
.pending{background:#e8f0f4;color:#345568}.progress{background:#e0f0f8;color:#28617c}.resolved{background:#e3f4e9;color:#28734b}.review{background:#fff0d8;color:#96621d}
@media(max-width:650px){.site{margin:0;min-height:100vh}.topbar{padding:0 14px}.navlinks{gap:10px}.navlinks a{font-size:10px}.content{padding:22px 16px}.hero{grid-template-columns:1fr!important}.map-art{height:210px!important}.form-card{margin-top:32px}.dashboard-title{align-items:flex-start!important;gap:12px;flex-direction:column}.table-wrap{overflow-x:auto}}
</style>
</head>
<body>
<div class="site">
<header class="topbar"><a class="brand" href="index.html">AquaDetect</a><nav class="navlinks"><a href="index.html">Home</a><a href="index.html#how-it-works">How it works</a><a href="login.html">Login</a><a class="signup-link" href="signup.html">Sign up</a></nav></header>
<main class="content" style="min-height:470px">
<div class="form-card">
<h2>Login</h2><p class="small-muted mb-3">Users and admins use the same form.</p>
<form>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" value="name@example.com"></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" value="password"></div>
<button class="btn btn-green w-100" type="button">Login</button>
</form>
<p class="form-foot">New here? <a href="signup.html">Create an account</a></p>
</div>
</main>
</div>
</body>
</html>
