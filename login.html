
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AquaDetect - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
    <a class="navbar-brand fw-bold" href="index.html">AquaDetect</a>
    <div class="ms-auto d-flex gap-3 align-items-center">
        <a class="nav-link text-white" href="index.html">Home</a>
        <a class="nav-link text-white" href="index.html#how-it-works">How it works</a>
        <a class="nav-link text-white" href="login.html">Login</a>
        <a class="btn btn-light text-primary" href="signup.html">Sign up</a>
    </div>
</nav>

<main class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h3 class="fw-bold">Login</h3>
                    <p class="text-secondary">
                        Users and admins use the same form.
                    </p>

                    <form action="#" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   placeholder="name@example.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control"
                                   placeholder="Enter password">
                        </div>

                        <button type="button" class="btn btn-success w-100">
                            Login
                        </button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        New here?
                        <a href="signup.html" class="text-success fw-bold">
                            Create an account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
